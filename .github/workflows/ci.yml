name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          moon version
          moon update

      - name: moon fmt --check
        run: moon fmt --check

      - name: moon info
        run: |
          moon info
          git diff --exit-code -- src/moontemplate/pkg.generated.mbti

      - name: moon check --deny-warn
        run: moon check --deny-warn

      - name: moon test --deny-warn
        run: moon test --deny-warn

      - name: Native CLI smoke test
        run: moon run src/cli --target native -- --template "Hello {{ name | uppercase }}" --var name=moonbit
